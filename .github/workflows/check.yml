# Prüfungen bei jedem Push und Pull Request:
# terminal_app über go vet, Tests und gofmt, web_app über Typcheck, Tests und Build.
name: check

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: terminal_app/go.mod
          cache-dependency-path: terminal_app/go.sum
      - working-directory: terminal_app
        run: make check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web_app/.nvmrc
          cache: npm
          cache-dependency-path: web_app/package-lock.json
      - working-directory: web_app
        run: npm ci
      # Typcheck, Tests und Build — dasselbe Gate wie vor dem Pages-Deploy.
      - working-directory: web_app
        run: npm run check
